# Stack mínima e fiel ao Supabase para testes ponta a ponta locais:
# Postgres + GoTrue (auth) + PostgREST (API) + gateway Nginx + MinIO (S3) + worker.
# Uso: sh infra/e2e/up.sh   (derruba com: docker compose -p mixpro-e2e down -v)
name: mixpro-e2e

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: pg
    ports: ["54322:5432"]
    volumes:
      - ./00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  auth:
    image: supabase/gotrue:v2.197.0
    depends_on: { db: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      API_EXTERNAL_URL: http://localhost:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:pg@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"

  rest:
    image: postgrest/postgrest:v16.4
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGRST_DB_URI: postgres://authenticator:authpass@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}

  gateway:
    image: nginx:alpine
    depends_on: [auth, rest]
    ports: ["54321:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: mixpro
      MINIO_ROOT_PASSWORD: mixpro-secret
    ports: ["9000:9000", "9001:9001"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 mixpro mixpro-secret >/dev/null 2>&1; do sleep 1; done;
             mc mb -p local/mixpro-audio && echo bucket-ok"

  worker:
    build:
      context: ../../apps/worker
      target: runtime
    profiles: ["worker"]
    environment:
      SUPABASE_URL: http://gateway
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: mixpro-audio
      S3_ACCESS_KEY_ID: mixpro
      S3_SECRET_ACCESS_KEY: mixpro-secret
      WORKER_ID: e2e-worker
