[project]
name = "mixpro-worker"
version = "0.1.0"
description = "Mix Pro — worker de processamento de áudio (DSP determinístico)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12",
  "numba>=0.60",
  "pedalboard>=0.9.8",
  "pyloudnorm>=0.1.1",
  "soundfile>=0.12",
  "jsonschema>=4.21",
  "httpx>=0.27",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mixpro-worker = "mixpro_worker.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mixpro_worker*"]

[tool.setuptools.package-data]
mixpro_worker = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
