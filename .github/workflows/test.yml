name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # versão do pnpm vem de "packageManager" no package.json da raiz
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testes do contracts
        run: pnpm --filter @mixpro/contracts test

      # FFmpeg para a decodificação do servidor (lib/export/ffmpeg-decode.test.ts compara com a
      # referência do app). A versão fixa do serviço fica no Dockerfile (fatia 3).
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg && ffmpeg -version | head -1

      # inclui os golden da exportação (nível exato e de tolerância) e a paridade de decodificação
      # (sem Chrome; a mídia pessoal de fixtures-local não existe no CI: esses formatos ficam PENDENTES)
      - name: Testes do app
        working-directory: apps/web
        env:
          REQUIRE_FFMPEG: "1"
        run: ../../packages/contracts/node_modules/.bin/tsx --test $(find lib -name "*.test.ts")

      # serviço de exportação (fatia 3): tipos e testes de ponta a ponta locais (pasta + JSON, sem rede)
      - name: Tipos do serviço de exportação
        run: apps/web/node_modules/.bin/tsc -p apps/export-service

      - name: Testes do serviço de exportação
        working-directory: apps/export-service
        env:
          REQUIRE_FFMPEG: "1"
        run: ../../packages/contracts/node_modules/.bin/tsx --test --test-concurrency=1 test/*.test.ts

  # imagem do serviço: construída e testada só aqui (nunca na máquina de desenvolvimento)
  imagem-servico:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build -f apps/export-service/Dockerfile -t mixpro-export .

      - name: Versão do FFmpeg na imagem
        run: docker run --rm mixpro-export sh -c "ffmpeg -version | head -1; dpkg-query -W ffmpeg"

      # job de ponta a ponta (3 formatos) e decodificação × referência do app, dentro da imagem
      - name: Autoteste dentro da imagem
        run: docker run --rm mixpro-export node selftest.mjs

      # ferramentas: o modelo de separação abre no onnxruntime-node e o FFmpeg tem o filtro rubberband
      - name: Separação de faixas e tom/andamento dentro da imagem
        run: |
          docker run --rm mixpro-export node -e "require('/app/node_modules/onnxruntime-node').InferenceSession.create('/app/models/htdemucs_fwd.onnx').then((s) => { console.log('modelo ok', s.inputNames.join(',')); process.exit(0); }, (e) => { console.error(e); process.exit(1); })"
          docker run --rm mixpro-export sh -c "ffmpeg -hide_banner -f lavfi -i sine=440:d=2 -af rubberband=pitch=1.122 -f null - 2>&1 | tail -2"

      - name: Serviço responde (healthz) e roda como usuário sem privilégios
        run: |
          docker run -d --name svc -p 8080:8080 mixpro-export
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          # falha de verdade se o serviço não subiu (antes o laço terminava sem erro)
          curl -fsS http://127.0.0.1:8080/healthz || { docker logs svc; exit 1; }
          test "$(docker exec svc id -u)" != "0"
          docker rm -f svc
